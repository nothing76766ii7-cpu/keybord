[package]
name    = "keybord_native"
version = "0.1.0"
edition = "2021"

[lib]
name       = "keybord_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni       = "0.21"
rusqlite  = { version = "0.31", features = ["bundled"] }
serde     = { version = "1",    features = ["derive"] }
serde_json= "1"
regex     = "1.10"

[dev-dependencies]
tempfile  = "3.10"

